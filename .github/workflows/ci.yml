name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential clang-format clang-tidy
      - name: Check clang-format
        run: |
          mapfile -t files < <(find src include apps tests android \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' -o -name '*.cc' -o -name '*.mm' \) \
            -type f | sort)
          clang-format --dry-run --Werror "${files[@]}"
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNYX_BUILD_GUI=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test libnyx
        run: ./build/nyx-tests
      - name: Test appcore
        run: ./build/nyx-appcore-tests
      - name: clang-tidy gate (stores + appcore)
        run: |
          # Narrow warnings-as-errors set; expand as debt is cleared.
          clang-tidy -p build \
            src/session_intent.cpp src/group.cpp src/identity.cpp src/file_access.cpp \
            src/avatar_store.cpp src/network_config.cpp src/profile_meta.cpp src/file_index.cpp \
            src/account_store.cpp src/message_store.cpp apps/nyx-app/appcore/session_types.hpp \
            apps/nyx-app/appcore/node_service_connect.cpp \
            apps/nyx-app/appcore/node_service_avatar.cpp \
            apps/nyx-app/appcore/node_service_files.cpp \
            apps/nyx-app/appcore/node_service_group.cpp \
            apps/nyx-app/appcore/node_service_chat.cpp \
            apps/nyx-app/appcore/node_service_call.cpp \
            apps/nyx-app/appcore/node_service.cpp \
            --checks='-*,misc-unused-using-decls,misc-redundant-expression,readability-duplicate-include,readability-container-size-empty,bugprone-use-after-move,bugprone-dangling-handle,bugprone-undefined-memory-manipulation' \
            --warnings-as-errors='misc-unused-using-decls,misc-redundant-expression,readability-duplicate-include,readability-container-size-empty,bugprone-use-after-move,bugprone-dangling-handle,bugprone-undefined-memory-manipulation'
      - name: clang-tidy (advisory)
        continue-on-error: true
        run: |
          mapfile -t files < <(find src include/nyx apps/nyx-app/appcore tests \
            \( -name '*.cpp' -o -name '*.hpp' \) -type f | sort)
          clang-tidy -p build "${files[@]}"
